<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ሮፋም የአማርኛ ሰዋሰው ጥያቄዎች 
</title>
 <link rel="stylesheet" href="Amharic.css"/>    
</head>
<body>
    <div class="container" id="menu-screen">
        <div class="header" style="text-align:center;">
            <h1>ሮፋም የአማርኛ ሰዋሰው ጥያቄዎች</h1>
            <div class="progress-wrapper">
                <div class="bar-bg"><div id="progress-fill"></div></div>
                <p id="stats-text" style="font-size: 0.9rem; margin-top: 8px;">0/18 Mastered</p>
            </div>
        </div>
        <div class="grid" id="topic-grid"></div>
    </div>

    <div class="container hidden" id="quiz-screen">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3 id="quiz-title" style="color:var(--gold); margin:0;">Topic</h3>
            <button onclick="exitQuiz()" style="background:none; border:1px solid #64748b; color:#64748b; border-radius:5px; padding:4px 8px;">አቋርጥ</button>
        </div>

        <p id="question-text" style="font-size:1.2rem; min-height:50px;"></p>
        
        <div id="options-container"></div>

        <div id="explanation-box">
            <strong style="color:var(--gold);">ገለፃ:</strong>
            <p id="explanation-text" style="margin:5px 0 0 0; font-size:0.9rem;"></p>
        </div>

        <button id="next-button" class="next-btn" onclick="nextQuestion()">ቀጥል →</button>
        <p id="q-counter" style="text-align:center; color:#64748b; font-size:0.8rem; margin-top:15px;"></p>
    </div>

    <footer>የተሰራው፦ በሀይለማርያም ተስፋዬ</footer>
<script src="amharic.js"></script>
</body>
</html>
