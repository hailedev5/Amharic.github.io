<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ሮፋም የአማርኛ ሰዋሰው ጥያቄዎች 
</title>
    <style>
        :root {
            --primary: #6366f1;
            --success: #22c55e;
            --danger: #ef4444;
            --dark: #0f172a;
            --card: #1e293b;
            --gold: #fbbf24;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark);
            color: #f8fafc;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .header h1 { color: var(--gold); margin: 0; font-size: 1.8rem; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        
        /* Progress Bar */
        .progress-wrapper { margin: 20px 0; }
        .bar-bg { background: #334155; height: 12px; border-radius: 10px; overflow: hidden; }
        #progress-fill { background: linear-gradient(90deg, var(--gold), #f59e0b); height: 100%; width: 0%; transition: 0.8s; }

        /* Grid */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .topic-btn {
            background: #334155;
            color: white;
            border: 2px solid transparent;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
        }
        .topic-btn.mastered { border-color: var(--success); background: rgba(34, 197, 94, 0.1); }

        /* Quiz UI */
        .option-btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            background: #334155;
            color: white;
            border: 3px solid transparent;
            border-radius: 10px;
            text-align: left;
            font-size: 1rem;
            transition: 0.2s;
        }

        /* Color States */
        .correct-glow { border-color: var(--success) !important; background: rgba(34, 197, 94, 0.2) !important; }
        .wrong-glow { border-color: var(--danger) !important; background: rgba(239, 68, 68, 0.2) !important; }

        #explanation-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            border-left: 4px solid var(--gold);
            display: none;
        }

        .next-btn {
            width: 100%;
            padding: 12px;
            background: var(--gold);
            color: var(--dark);
            border: none;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 15px;
            display: none;
            cursor: pointer;
        }

        .hidden { display: none; }
        footer { margin-top: 25px; color: var(--gold); font-weight: bold; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="container" id="menu-screen">
        <div class="header" style="text-align:center;">
            <h1>ሮፋም የአማርኛ ሰዋሰው ጥያቄዎች</h1>
            <div class="progress-wrapper">
                <div class="bar-bg"><div id="progress-fill"></div></div>
                <p id="stats-text" style="font-size: 0.9rem; margin-top: 8px;">0/18 Mastered</p>
            </div>
        </div>
        <div class="grid" id="topic-grid"></div>
    </div>

    <div class="container hidden" id="quiz-screen">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3 id="quiz-title" style="color:var(--gold); margin:0;">Topic</h3>
            <button onclick="exitQuiz()" style="background:none; border:1px solid #64748b; color:#64748b; border-radius:5px; padding:4px 8px;">አቋርጥ</button>
        </div>

        <p id="question-text" style="font-size:1.2rem; min-height:50px;"></p>
        
        <div id="options-container"></div>

        <div id="explanation-box">
            <strong style="color:var(--gold);">ገለፃ:</strong>
            <p id="explanation-text" style="margin:5px 0 0 0; font-size:0.9rem;"></p>
        </div>

        <button id="next-button" class="next-btn" onclick="nextQuestion()">ቀጥል →</button>
        <p id="q-counter" style="text-align:center; color:#64748b; font-size:0.8rem; margin-top:15px;"></p>
    </div>

    <footer>የተሰራው፦ በሀይለማርያም ተስፋዬ</footer>

    <script>
        const data = {
            "ስም": { q: [{t: "የተጸውa ስም የሆነው የትኛው ነው?", o: ["ከተማ", "ኪሊማንጃሮ ተራራ", "ሰራዊት","ደግነት"], a: 0, e:"የተፀውኦ ስሞች አንድ ተለይቶ የሚታወቅ ነገርን ብቻ ይገልፃሉ። "},{t:"ስም ማለት ምን ማለት ነው?", o: ["የግስ ጭማሪ ማለት ነው::", "የማንኛውም ነገር መጠሪያ ማለት ነው::","ከስም በፊት እና በኋላ እየገባ ስምን የሚገልጽ ነው::","አ/ነገር እና አ/ነገርን የሚያይዝ ነው::"], a: 1, e:"ስም የሌለው ነገር የለም።"}, {t: "ስም የሆነው የቱ ነው?", o: ["መሮጥ", "በፍጥነት","ረጅም","ወፍ"], a: 3,e:"ወፍ የጥቅል ስም ነው።"}, {t: "የስም አይነት ያልሆነው የቱ ነው? ", o: ["የሁኔታ ተውሳከ ግስ", "የወል ስም","የጥቅል ስም","የረቂቅ ስም"], a: 0,e:"የሁኔታ ተውሳከ ግስ የተውሳከ ግስ አይነት ነው።"},{t: "የረቂቅ ስም የሆነው የትኛው ነው?", o: ["ፍቅር", "ትህትና","ሀዘን","ሁሉም"], a: 3,e:"ሁሉም ሊታዩ ወይም ሊዳሰሱ አይችሉም።"}]},
            "ተውላጠ ስም": { q: [{t: "ሁለተኛ መደብ ብዙ ቁጥር የሆነው ተውላጠ ስም የቱ ነው?", o: ["እነሱ", "እናንተ","እኔ","እኛ"], a:0, e:"''አንተ'' እና ''አንቺ'' የሚባሉትን ሁለተኛ መደብ ነጠላ ቁጥር ተውላጠ ስሞችን በጋራ ለመጥራት ''እናንተ'' የሚለውን ሁለተኛ መደብ ብዙ ቁጥር እንጠቀማለን።"}, {t: "የተውላጠ ስም ጥቅም የሆነው የቱ ነው?", o: ["የሀሳብ መዛባት ያመጣል::", "ግስን ይገልፃል::","ስምን ይተካል::","አላስፈላጊ ይሰጣል ድግግሞሽን ያስወግዳል::","3ተኛውና አራተኛው መልስ ናቸው::"], a: 4,e:"ለምሳሌ:- ''አስቴር ጎበዝ ተማሪ ናት። እሷ ከክፍሏ  አንደኛ ትወጣለች።'' ማለት ብንፈልግ አስቴርን እንዴ ከገለፅን ሌላ ሰው ካልገለፅን ይሆንን ሰዋሰዋዊ ስርዓት መከተል እንችላለን። በዚህም የስም ድግግሞሽን እናስቀራለን።"}, {t: "ሦስተኛ ምድብ አንስታይ ፆታ ተውላጠ ስም የሆነው የቱ ነው?", o: ["እሱ", "እነሱ","እሷ","አንቺ"], a: 2,e:"እሷ የሚለው ተውላጠ ስም ሶስተኛ መደብ አንስታይ ፆታን ያመለክታል።"}, {t: "ተውላጠ ስም በስንት መድብ የተከፋፈለ ነው::", o: ["በስምንት", "በሶስት","በአምስት","በሁለት"], a: 1,e:"በሶስት ምድብ የተከፋፈለ ሲሆን እነሱም አንደኛ መደብ፣ሁለተኛ መደብ እና ሶስተኛ መደብ ናቸው "}, {t: "ነጠላ ቁጥር የሆነ አንደኛ መደብ ተውላጠ ስም የሆነው የቱ ነው?", o: ["እሷ", "እርስዎ","እናንተ","እኔ"], a: 3,e:"እኔ የሚለው ራስን የሚመለክት ለሁለቱም ፆታዎች የሚሆን አንደኛ መደብ ነጠላ ቁጥር ተውላጠ ስም ነው።"}]},
            "ግስ": { q: [{t: "ግስ በአረፍተ ነገር ውስጥ ምን ሊሆን ይችላል?", o: ["የአርፍተ ነገር መቋጫ", "ድርጊት","ድርጊት የፈፀመው አካል","አንደኛው እና ሁለተኛው መልስ ናቸው"], a: 3,e:"ግስ በአርፍተ ነገር ውስጥ መጨረሻ ላይ አርፍተነገሩን በድርጊት ይደመድማል ወይም በባለቤት የተፈፀመ፤በተሳቢ ላይ የሚፈፀም ድርጊትን የሚያመለክት የቃል ክፍል ነው።"}, {t: "የግስ አይነቶች ከሚባሉት ውስጥ ያልሆነው የቱ ነው?", o: ["የድርጊት ግስ", "ወደረኛ መስተፃምር","የመኖር ግስ","የመሆን ግስ"], a: 1,e:"ወደረኛ መስተፃምር ሁለት ነገሮችን የሚያወዳድር የመስተፃምር አይነት ነው።"}, {t: "ከሚከተሉት ውስጥ የድርጊት ግስ የሆነው የቱ ነው?", o: ["ሰበረ", "አለ","ነው","በተጨማሪ"], a: 0,e:"''ሰበረ'' አንድን ነገር የመስበር ድርጊትን የሚያሳይ የድርጊት ግስ ነው።"},{t:"የድርጊት ግስ አይነት የሆኑት የትኞቹ ናቸው?", o:["ሳቢ (ተሻጋሪ ግስ)","ጠቋሚ መስተፃምር","ኢ-ሳቢ (የማይሻገር ግስ)","ከሁለተኛው በስተቀር ሁሉም መልስ ናቸው"],a:3,e:"ሳቢ ግስ ባለቤትን እና ተሳቢን የሚያካትት የድርጊት ግስ አይነት ሲሆን ኢ-ሳቢ ግስ ደግሞ ድርጊቱ በባለቤቱ ላይ ያለቀ ብቻ መሆኑን የሚያመለክት የድርጊት ግስ አይነት ነው።"},{t:"ከሚከተሉት ውስጥ ሳቢ ግስ የሆነው የቱ ነው?",o:["ተኛ","ሽጠ","ሄደ","መጣ"],a:1,e:"''ሸጠ'' የሚለው ግስ የመሸጥ ድርጊት የፈፀመ አካልና የተፈፀመበት አካል እንዳለ ያመለክታል። ስለዚህ ሳቢ ግስ ነው።"}]},
            "ቅፅል": { q: [{t: "ቅፅል ማለት ምን ማለት ነው?", o: ["ለስም የተሰጠ ሌላኛው መጠሪያ ማለት ነው።", "የስም ገላጭ ማለት ነው።","ከግስ በፊት እየገባ ግስን የሚገልፅ ነው።","ድርጊት ተቀባይ ነው።"], a: 1}, {t: "ባህሪ አመልካች ቅፅል የሆነው የቱ ነው?", o: ["ቀያይ", "ንቁ","ጎበዝ","ሁለተኛውና ሦስተኛው መልሥ መሆን ይችላሉ"], a: 3}, {t: "ቅፅል ከስም በስተየት ሊገኝ ይችላል?", o: ["በስተግራ እና በስተቀኝ", "በመሀል","በግርጌ","ከግስ በፊት"], a: 0}, {t: "የመጠን ቅፅል የሆነው የቱ ነው?", o: ["ቀጭን", "ወፍራም","ደንዳና","ሁሉም"], a: 3}, {t: "ቅፅል የሆነው የትኛው ነው?", o: ["በፍጥነት", "እስያ","ጠይም","ወደ"], a: 2}]},
            "ተውሳከ ግስ": { q: [{t: "''ተውሳክ'' ማለት ምን ማለት ነው?", o: ["የግዕዝ ቃል ሲሆን ''ጭማሪ'' ማለት ነው።", "ግስን እና ግስን የሚያገናኝ ማለት ነው።","የግስ ገላጭ ማለት ነው።","ስምን የሚተካ ነው።"], a: 0}, {t: "ተውሳከ ግስ ከግስ በፊት እየገባ_____በመሆን ያገለግላል", o: ["የስም ገላጭ", "መጠን አመልካች ቅፅል","የግስ ገላጭ","መልስ አልተሰጠም"], a: 2}, {t: "የሁኔታ ተውሳከ ግስ የሆነው የትኛው ነው?", o: ["ክፋኛ", "ምንኛ","በጣም","ሁሉም"], a: 3}, {t: "ውልድ ተውሳከ ግስ እና ነባር ተውሳከ ግስ በምን ይለያሉ?", o: ["የሁኔታ ተውሳከ እና የጊዜ ተውሳከ ግሶችን በማካተታቸው", "ውልድ ተውሳከ ግሶች ''-ኧኛ'' የሚለውን ቅጥያ ስለሚወስዱ","ሁለቱም የተለያዩ የተውሳከ ግስ አይነቶች በመሆናቸው ","መልስ አልተሰጠም"], a: 1}, {t: "የጊዜ አመልካች ተውሳከ ግስ የሆነው የቱ ነው?", o: ["ትናንትና", "በጠዋት","ሲመሽ","ሁሉም"], a: 3}]},
            "አያያዦች": { q: [{t: "አያያዥ ምን እና ምንን ያያይዛሉ?", o: ["ቃልና ቃልን", "ሀረግ እና ሀረግን","አርፍተነገር እና አረፍተነገርን","ሁሉም"], a: 3}, {t: "አያያዦች ከሚያያይዙት ሀሳብ አንፃር በሁለት ይከፈላል። ምን አይነት ሀሳብ ያላቸውን ሊያይዝ ይችላል? ", o: ["ተመሳሳይ ሀሳብ ያላቸውን ሁለት ሀሳቦች ", "ተቃራኒ ሀሳብ ያላቸውን ሁለት ሀሳቦች","የአንደኛውና የሁለተኛው መልስ ናቸው።","ፊደልና ፊደልን"], a: 2}, {t: "ተመሳሳይ ሀሳብን የሚያይዙት አያያዦች ከሚከተሉት ውስጥ የትኞቹ ናቸው?", o: ["ስለሆነም", "ነገር ግን","ሆኖም ግን","በተጨማሪም","የአንደኛውና የአራተኛው መልስ መሆን ይችላሉ"], a: 4}, {t: "ተቃራኒ ሀሳብን የሚያይዙት አያያዦች ከሚከተሉት ውስጥ የትኛው ነው?", o: ["በተጨማሪም", "ዳሩ ግን","በመሆኑም","ከዚህም በላይ"], a: 1}, {t: "''ጤና አዳም ለቅመማ ቅመምነት ያገለግላል፤_____ከሻይ ጋርም ሊቀርብ ይችላል።''ይህንን አርፍተ ነገር ለማሟላት ሊስማማው የሚችለው ከሚከተሉት ውስጥ የትኛው አያያዥ ቃል ነው?", o: ["በተጨማሪም", "ይሁን እንጂ","እና","በመሆኑም"], a: 0}]},
            "ስርዓተ-ነጥብ": { q: [{t: "የስርዓተ ነጥቦች ጠቀሜታ ምንድን ነው?", o: ["የፅሁፍን ሀሳብ ላለማዛባት", "አነጋገርን በፅሁፍ ለመግለፅ ስንፈልግ ለመግለፅ","ፅሁፍን ትርጉም የለሽነታቸውን ለማስተካከል ","ሁሉም"], a: 3}, {t: "ቁጣንና ትዕዛዝን የሚያመለክተው ከሚከተሉት ውስጥ የትኛው ስርዓተ ነጥብ ነው?", o: ["እመጫት (^)", "ቃለ አጋኖ፣አቆልቋይ (!)","ይዘት (.)","የመሀል ሰረዝ ነጠላ ሰረዝ (፥)"], a: 1}, {t: "ፅሁፍን አራርቆ መፃፍ ባልተጀመረበት ጊዜ ቃላትን ከቃላት ለመለየት የምንጠቀምበት ስርዓተ ነጥብ የቱ ነው?", o: ["ሁለት ነጥብ (:)", "ድርብ ሰረዥ (፤)","ትዕምርተ ጥቅስ (« »)","ትዕምርተ ስላቅ (¡)"], a: 0}, {t: "ምዕራፍን ከንዑስ ቁጥሮች ለመለየት የምንጠቀምባቸው ስርዓተ ነጥቦች የትኞቹ ናቸው?", o: ["ይዘት (.)", "የላይ ሰረዝ ነጠላ ሰረዝ (፣)","የመሀል ሰረዝ ነጠላ ሰረዝ (፥)","የአንደኛውና የሶስተኛው መልስ መሆን ይችላሉ።"], a: 3}, {t: "ቃላትን አሳጥሮ ለመፃፍ የሚያገለግሉት ስርዓተ ነጥቦች የትኞቹ ናቸው? ", o: ["ሰረዝ (-)", "ይዘት (.)","እዝባር (/)","የሁለተኛውና የሶስተኛው መልስ መሆን ይችላሉ"], a: 3}]},
            "ቢጋር": { q: [{t: "ቢጋር ማለት ምን ማለት ነው?", o: ["አስተዋፅኦ ማለት ነው።", "አንድን ፅሁፍ ከመፃፋችን በፊት የፅሁፋን ዋናና ዝርዝር ጉዳዮች የምንነድፍበት ነው።","አንድ ፅሁፍ ማራኪ አፃፃፍ እንዲኖረው ከመፃፋችን በፊት የምንሰራው ነው።","ሁሉም መልስ መሆን ይችላሉ።"], a: 3}, {t: "ከሚከተሉት ውስጥ ቢጋር በየትኞቹ የአነዳደፍ ዘዴዎች ሊቀርብ ይችላል?", o: ["በርዕስ መልክ", "በአጭር መልክ","በአርፍተነገር መልክ","የአንደኛውና የሶስተኛው መልስ ይሆናሉ።"], a: 3}, {t: "ከሚከተሉት ውስጥ የቢጋር ጥቅም ያልሆነው የቱ ነው?", o: ["የፅሁፍ ሀሳብን ያዛባል።", "ከርዕሰ ጉዳዩ እንዳንወጣ ያግዘናል።","የፅሁፋን ሀሳብ በቅደም ተከተል እንድናስቀምጥ ያደርጋል።","ፍሬ ሀሳቦችን እና ዝርዝር ሀሳቦችን ለማስፈር ያግዛል።"], a: 0}, {t: "ቢጋር ከሀሳብ አወራረድ አንፃር በስንት ይከፈላል? እነማን ናቸው?", o: ["በሦስት፤ እነሰም፦ የሀላፊ፣ የአሁን እና የትንቢት (የወደፊት) ናቸው። ", "በሁለት ይከፈላሉ። እነሱም ፦ መደበኛ ቢጋር እና ኢ-መደበኛ ቢጋር ናቸው","የተውሳከ ግስ አይነቶች የምንላቸው ናቸው።","መልስ አልተሰጠም"], a: 1}, {t: "_____ለሀሳብ አወራረዳችን እና ለፅሁፋ ቅደም ተከትል ሳንጨነቅ የምንነድፈው የቢጋር አይነት ነው።", o: ["በርዕስ መልክ የተፃፈ ቢጋር", "መደበኛ ቢጋር","ኢ-መደበኛ ቢጋር","በዓርፍተነገር መልክ የተፃፈ ቢጋር"], a:2}]},
            "ጊዜ": { q: [{t: "ጊዜ ማለት_____", o: ["የግስ ጭማሪ ማለት ነው።", "ከስም በፊት የሚገባ ቃል ነው።","አንድ ድርጊት የተፈፀመበትን ጊዜ የሚያመለክት ነው።","መልስ አልተሰጠም"], a: 2}, {t: "የአሁን ጊዜን የሚያመለክተው የትኛው ነው?", o: ["ምሳውን በላ።", "አበበ በሶ እየጠጣ ነው።","ወደ ት/ቤት ሊሄድ ነው።","የቤት ስራውን ሰርቷል።"], a: 1}, {t: "የትንቢት ጊዜን የሚያመለክተው የትኛው ነው?", o: ["የቀጣይ ሳምንት", "እየበላ ነበር","ወደ ቤት ሂዷል","መልስ አልተሰጠም"], a: 0}, {t: "የሀላፊ ጊዜ በሶስት ይከፈላል፤ እነሱም የዋህ ሀላፊ፣የሩቅ ሀላፊ እና የቅርብ ሀላፊ ናቸው። ከሚከተሉት ውስጥ የትኛው የሀላፊ ጊዜ አይነት ነው ድርጊቱ የተፈጸመበትን ትክክለኛ ጊዜ የማያመለክተው?", o: ["የሩቅ ሀላፊ", "የቅርብ ሀላፊ","የምክንያት ተውሳከ ግስ","የዋህ ሀላፊ"], a: 3}, {t: "የሩቅ ሀላፊን የሚያመለክተው አርፍተ ነገር የቱ ነው?", o: ["ምሳዬን እየበላሁ ነው።", "ከትምህርት ቤት ሊወጣ ነበር።","ቀጣይ ሳምንት ወደ ሀዋሳ ይሄዳል።","ከበደ ብር አለው።"], a: 1}]},
             // Add more topics here following the same structure!
        };

        let currentTopic = "", currentIdx = 0, score = 0, canAnswer = true;

        function refreshMenu() {
            const grid = document.getElementById('topic-grid');
            grid.innerHTML = "";
            let mastered = 0;
            Object.keys(data).forEach(t => {
                const isM = localStorage.getItem('rofam_'+t) === "done";
                if(isM) mastered++;
                const btn = document.createElement('button');
                btn.className = `topic-btn ${isM?'mastered':''}`;
                btn.innerHTML = `${t}${isM?'<br><small>ተጠናቋል ✓</small>':''}`;
                btn.onclick = () => startQuiz(t);
                grid.appendChild(btn);
            });
            document.getElementById('progress-fill').style.width = (mastered / Object.keys(data).length)*100 + "%";
            document.getElementById('stats-text').innerText = `${mastered}/${Object.keys(data).length} ተጠናቋል`;
        }

        function startQuiz(topic) {
            currentTopic = topic; currentIdx = 0; score = 0;
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            canAnswer = true;
            const q = data[currentTopic].q[currentIdx];
            document.getElementById('quiz-title').innerText = currentTopic;
            document.getElementById('question-text').innerText = q.t;
            document.getElementById('q-counter').innerText = `Question ${currentIdx+1} of ${data[currentTopic].q.length}`;
            document.getElementById('explanation-box').style.display = 'none';
            document.getElementById('next-button').style.display = 'none';

            const container = document.getElementById('options-container');
            container.innerHTML = "";
            q.o.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "option-btn";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(i, btn);
                container.appendChild(btn);
            });
        }

        function checkAnswer(choice, btn) {
            if(!canAnswer) return;
            canAnswer = false;
            const correctIdx = data[currentTopic].q[currentIdx].a;
            const allBtns = document.querySelectorAll('.option-btn');

            if(choice === correctIdx) {
                btn.classList.add('correct-glow');
                score++;
            } else {
                btn.classList.add('wrong-glow');
                allBtns[correctIdx].classList.add('correct-glow');
            }

            document.getElementById('explanation-text').innerText = data[currentTopic].q[currentIdx].e;
            document.getElementById('explanation-box').style.display = 'block';
            document.getElementById('next-button').style.display = 'block';
        }

        function nextQuestion() {
            currentIdx++;
            if(currentIdx < data[currentTopic].q.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            const pass = score >= (data[currentTopic].q.length * 0.8);
            alert(`Topic Finished! Score: ${score}/${data[currentTopic].q.length}`);
            if(pass) {
                localStorage.setItem('rofam_'+currentTopic, "done");
                alert("Mastery Achievement Unlocked! 🎉");
            }
            exitQuiz();
        }

        function exitQuiz() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('menu-screen').classList.remove('hidden');
            refreshMenu();
        }

        refreshMenu();
    </script>
</body>
</html>
